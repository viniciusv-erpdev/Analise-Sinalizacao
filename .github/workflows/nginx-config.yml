name: Nginx configuration preparation
on:
  push:
    paths: ['deploy/**', 'config/proxy.py', 'config/settings.py', 'config/test_proxy.py', 'scripts/test_nginx_template.py', 'scripts/test_gunicorn_config.py', '.github/workflows/nginx-config.yml']
  pull_request:
    paths: ['deploy/**', 'config/proxy.py', 'config/settings.py', 'config/test_proxy.py', 'scripts/test_nginx_template.py', 'scripts/test_gunicorn_config.py', '.github/workflows/nginx-config.yml']
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt 'ansible-core>=2.19,<2.20'
      - name: Extract Nginx for syntax tests only (no package installation or service)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nginx-download" "$RUNNER_TEMP/nginx-test"
          cd "$RUNNER_TEMP/nginx-download"
          sudo apt-get update
          apt-get download nginx
          for package in ./*.deb; do dpkg-deb -x "$package" "$RUNNER_TEMP/nginx-test"; done
          echo "$RUNNER_TEMP/nginx-test/usr/sbin" >> "$GITHUB_PATH"
      - name: Check Django and proxy settings
        env:
          DJANGO_DEBUG: 'True'
        run: |
          python manage.py check
          python manage.py test config.test_proxy
      - name: Test render matrix, HTTP compatibility, role input validation and Nginx syntax
        run: |
          command -v nginx
          command -v ansible-playbook
          python -m unittest scripts.test_nginx_template scripts.test_gunicorn_config -v
