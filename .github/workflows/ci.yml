
name: Django CI

on:
  push:
    branches:
      - vinicius
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar configurações Django
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py check

      - name: Executar testes do fluxo principal
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test accidents.test_main_flow
