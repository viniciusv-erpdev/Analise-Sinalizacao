
name: Django CI

on:
  push:
    branches:
      - vinicius
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verificar configurações Django
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py check

      - name: Executar testes do fluxo principal e sinalização
        env:
          DJANGO_DEBUG: "True"
        run: python manage.py test accidents.test_main_flow signaling

      - name: Configurar Node para testes de interface
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Testar interface de mapa e sinalização
        run: node --test static/js/individual_filters.test.js static/js/map.test.js static/js/intersection_problems.test.js static/js/report_characterization.test.js
