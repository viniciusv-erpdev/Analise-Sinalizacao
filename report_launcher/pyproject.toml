[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "analise-report-launcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]==3.3.5", "dbus-next==0.2.3"]

[tool.setuptools]
packages = ["report_launcher"]
package-dir = {report_launcher = "."}
